name: Build raw NOVA AI 3.6 page

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build-original-raw.mjs"
      - "nova-ai-3-6/app-*.b64"
      - ".github/workflows/build-direct-pages.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build raw original page
        run: node scripts/build-original-raw.mjs

      - name: Verify raw page
        run: |
          test -s nova-ai-original/index.html
          grep -q 'initApp' nova-ai-original/index.html
          if grep -qE 'part-[123]\.js|DecompressionStream|const input=|جاري تشغيل الموقع' nova-ai-original/index.html; then
            echo "Generated page is still a loader instead of the raw app"
            exit 1
          fi
          echo "Raw page size: $(wc -c < nova-ai-original/index.html) bytes"

      - name: Commit generated raw page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-ai-original/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build raw NOVA AI 3.6 page"
          git push
