name: Build direct NOVA AI pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build-direct.mjs"
      - "app-*.b64"
      - "nova-ai-3-6/app-*.b64"
      - "index.html"
      - ".github/workflows/build-direct-pages.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone pages
        run: node scripts/build-direct.mjs

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-ai-final/index.html nova-ai-original/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build standalone NOVA AI pages"
          git push
