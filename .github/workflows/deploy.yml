name: Deploy NOVA AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone NOVA AI pages
        run: node scripts/build-direct.mjs

      - name: Verify generated pages
        run: |
          test -s nova-ai-final/index.html
          test -s nova-ai-original/index.html
          if grep -q "Failed to fetch" nova-ai-final/index.html nova-ai-original/index.html; then
            echo "Generated pages still contain the old loader error"
            exit 1
          fi
          echo "Final page size: $(wc -c < nova-ai-final/index.html) bytes"
          echo "Original page size: $(wc -c < nova-ai-original/index.html) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
