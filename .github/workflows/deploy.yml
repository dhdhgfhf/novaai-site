name: Deploy NOVA AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify original static page
        run: |
          test -s nova-ai-original/index.html
          test -s nova-ai-original-live/part-1.js
          test -s nova-ai-original-live/part-2.js
          test -s nova-ai-original-live/part-3.js
          if grep -q "Failed to fetch" nova-ai-original/index.html; then
            echo "The original page still contains the old loader error"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
