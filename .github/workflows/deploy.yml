name: Deploy NOVA AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build one-file NOVA AI 3.6 page
        run: node scripts/build-original-embedded.mjs

      - name: Verify embedded original page
        run: |
          test -s nova-ai-original/index.html
          if grep -qE 'part-[123]\.js|Failed to fetch|fetch\(' nova-ai-original/index.html; then
            echo "Original page still depends on external loading"
            exit 1
          fi
          grep -q 'const input=' nova-ai-original/index.html
          echo "Embedded original page size: $(wc -c < nova-ai-original/index.html) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
