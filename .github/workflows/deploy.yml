name: Deploy NOVA AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean NOVA AI 3.6 files
        run: |
          test -s nova-ai-original/index.html
          test -s nova-ai-original-clean/index.html
          for f in raw-1.js raw-2.js raw-3.js raw-4.js raw-5.js raw-6b.js raw-7b.js raw-8b.js; do
            test -s "nova-ai-original-clean/$f"
          done
          grep -q "nova-ai-original-clean" nova-ai-original/index.html
          echo "Clean NOVA AI 3.6 files are ready"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
