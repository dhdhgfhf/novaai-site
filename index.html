<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحميل NovaAI…</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{text-align:center;padding:24px}.gem{width:58px;height:58px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#7c6aff,#ff6b9d);font-size:24px;box-shadow:0 0 30px rgba(124,106,255,.28);animation:p 1.4s ease-in-out infinite}.msg{font-size:14px;color:#9999b5}.err{max-width:520px;line-height:1.7;color:#ff8bad;white-space:pre-wrap}@keyframes p{50%{transform:scale(1.07);box-shadow:0 0 42px rgba(124,106,255,.42)}}
</style>
</head>
<body>
<div class="box"><div class="gem">✦</div><div id="status" class="msg">جاري تشغيل NovaAI…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('المتصفح قديم ولا يدعم فك ضغط التطبيق. افتح الرابط في أحدث إصدار من Chrome أو Edge.');
    const names=['app-1.b64','app-2.b64','app-3.b64'];
    const parts=await Promise.all(names.map(async name=>{
      const r=await fetch(name+'?v=eleven2',{cache:'no-store'});
      if(!r.ok) throw new Error('تعذر تحميل '+name+' — HTTP '+r.status);
      return (await r.text()).trim();
    }));
    const binary=atob(parts.join(''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    const patch='\n(() => {\n  const oldStopAllAudio = stopAllAudio;\n  let novaElSource = null;\n  let novaElAudioContext = null;\n\n  function setElevenStatus(message, type = "info") {\n    const el = document.getElementById("eleven-status");\n    if (!el) return;\n    el.textContent = message;\n    el.style.color = type === "ok" ? "#1fba7e" : type === "error" ? "#ff6b9d" : "#7878a0";\n  }\n\n  function addElevenTestUI() {\n    const input = document.getElementById("eleven-inp");\n    if (!input || document.getElementById("eleven-test-btn")) return;\n    input.placeholder = "ضع مفتاح ElevenLabs هنا";\n    const btn = document.createElement("button");\n    btn.id = "eleven-test-btn";\n    btn.className = "demo-btn";\n    btn.style.marginTop = "0";\n    btn.textContent = "✓ اختبر مفتاح ElevenLabs";\n    btn.onclick = testElevenLabs;\n    const status = document.createElement("div");\n    status.id = "eleven-status";\n    status.style.cssText = "font-size:11px;color:#7878a0;line-height:1.7;margin:5px 0 4px";\n    status.textContent = elevenKey ? "المفتاح محفوظ. اضغط اختبار ElevenLabs." : "لم يتم إضافة مفتاح ElevenLabs.";\n    input.insertAdjacentElement("afterend", status);\n    input.insertAdjacentElement("afterend", btn);\n  }\n\n  async function unlockElevenAudio() {\n    const AC = window.AudioContext || window.webkitAudioContext;\n    if (!AC) throw new Error("audio_context_unavailable");\n    if (!novaElAudioContext || novaElAudioContext.state === "closed") novaElAudioContext = new AC();\n    if (novaElAudioContext.state === "suspended") await novaElAudioContext.resume();\n    return novaElAudioContext;\n  }\n\n  function friendlyElevenError(error) {\n    const status = Number(error?.status || 0);\n    const raw = String(error?.message || error || "");\n    if (status === 401) return "مفتاح ElevenLabs غير صحيح أو تم إلغاؤه.";\n    if (status === 403) return "المفتاح لا يملك صلاحية Text to Speech، أو عليه تقييد IP. فعّل صلاحية text_to_speech داخل ElevenLabs.";\n    if (status === 404) return "صوت ElevenLabs غير متاح لهذا الحساب.";\n    if (status === 422) return "ElevenLabs رفض إعدادات الصوت. أنشئ مفتاحًا بصلاحية Text to Speech.";\n    if (status === 429) return "رصيد ElevenLabs أو الحد المسموح انتهى. راجع Usage داخل حسابك.";\n    if (/Failed to fetch|NetworkError|Load failed/i.test(raw)) return "تعذر الوصول إلى ElevenLabs من المتصفح. تحقق من الإنترنت وأوقف مانع الإعلانات لهذا الموقع.";\n    if (/play|audio_context/i.test(raw)) return "المتصفح منع تشغيل الصوت. اضغط زر الاختبار مرة أخرى وتأكد أن صوت الهاتف غير مكتوم.";\n    return raw.replace(/^ElevenLabs\\s*/i, "") || "حدث خطأ غير معروف في ElevenLabs.";\n  }\n\n  async function readElevenError(res) {\n    let detail = "";\n    try {\n      const data = await res.clone().json();\n      const d = data?.detail ?? data?.message ?? data;\n      detail = typeof d === "string" ? d : (d?.message || d?.status || JSON.stringify(d));\n    } catch (e) {\n      try { detail = await res.text(); } catch (_) {}\n    }\n    const err = new Error(detail || `ElevenLabs HTTP ${res.status}`);\n    err.status = res.status;\n    return err;\n  }\n\n  function splitElevenText(text, maxLen = 450) {\n    const sentences = text.match(/[^.!?،؟\\n]+[.!?،؟\\n]*/g) || [text];\n    const chunks = [];\n    let buf = "";\n    for (const sentence of sentences) {\n      const t = sentence.trim();\n      if (!t) continue;\n      if ((buf + " " + t).trim().length > maxLen) {\n        if (buf) chunks.push(buf.trim());\n        buf = t;\n      } else {\n        buf = (buf + " " + t).trim();\n      }\n    }\n    if (buf) chunks.push(buf.trim());\n    return chunks.length ? chunks : [text];\n  }\n\n  Object.assign(EL_VOICES.slow,   { id: "21m00Tcm4TlvDq8ikWAM", name: "Rachel", speed: 0.82, stability: 0.58, style: 0.08 });\n  Object.assign(EL_VOICES.normal, { id: "JBFqnCBsd6RMkjVDRZzb", name: "George", speed: 1.00, stability: 0.48, style: 0.12 });\n  Object.assign(EL_VOICES.fast,   { id: "JBFqnCBsd6RMkjVDRZzb", name: "George", speed: 1.16, stability: 0.38, style: 0.28 });\n  Object.assign(EL_VOICES.human,  { id: "21m00Tcm4TlvDq8ikWAM", name: "Rachel", speed: 0.95, stability: 0.35, style: 0.32 });\n\n  saveElevenKey = function (value) {\n    elevenKey = value.trim();\n    try {\n      elevenKey ? localStorage.setItem("nova_eleven_key", elevenKey) : localStorage.removeItem("nova_eleven_key");\n    } catch (e) {}\n    setElevenStatus(elevenKey ? "تم حفظ المفتاح. اضغط اختبار ElevenLabs." : "لم يتم إضافة مفتاح ElevenLabs.", "info");\n    renderVoiceOpts();\n  };\n\n  stopAllAudio = function () {\n    oldStopAllAudio();\n    if (novaElSource) {\n      try { novaElSource.onended = null; novaElSource.stop(0); } catch (e) {}\n      novaElSource = null;\n    }\n  };\n\n  elevenLabsFetch = async function (text, voiceId) {\n    if (!elevenKey) throw new Error("لم يتم إضافة مفتاح ElevenLabs.");\n    const profile = EL_VOICES[voiceP] || EL_VOICES.normal;\n    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voiceId)}?output_format=mp3_44100_128`, {\n      method: "POST",\n      mode: "cors",\n      headers: {\n        "xi-api-key": elevenKey,\n        "Content-Type": "application/json",\n        "Accept": "audio/mpeg"\n      },\n      body: JSON.stringify({\n        text,\n        model_id: "eleven_multilingual_v2",\n        voice_settings: {\n          stability: profile.stability,\n          similarity_boost: 0.78,\n          style: profile.style,\n          speed: profile.speed,\n          use_speaker_boost: true\n        }\n      })\n    });\n    if (!res.ok) throw await readElevenError(res);\n    return await res.arrayBuffer();\n  };\n\n  async function playElevenBuffer(arrayBuffer, id) {\n    const ctx = await unlockElevenAudio();\n    const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));\n    if (speakId !== id) return;\n    await new Promise((resolve, reject) => {\n      const source = ctx.createBufferSource();\n      novaElSource = source;\n      source.buffer = decoded;\n      source.connect(ctx.destination);\n      source.onended = () => {\n        if (novaElSource === source) novaElSource = null;\n        resolve();\n      };\n      try { source.start(0); } catch (error) { reject(error); }\n    });\n  }\n\n  speakElevenLabs = async function (text, id) {\n    const profile = EL_VOICES[voiceP] || EL_VOICES.normal;\n    setElevenStatus("جاري الاتصال بـ ElevenLabs…", "info");\n    try {\n      for (const chunk of splitElevenText(text)) {\n        if (speakId !== id) break;\n        const audio = await elevenLabsFetch(chunk, profile.id);\n        if (speakId !== id) break;\n        await playElevenBuffer(audio, id);\n      }\n      if (speakId === id) setElevenStatus("ElevenLabs يعمل بنجاح ✅", "ok");\n    } catch (error) {\n      setElevenStatus("خطأ: " + friendlyElevenError(error), "error");\n      throw error;\n    } finally {\n      if (speakId === id) {\n        speakId = null;\n        resetLBtns();\n      }\n    }\n  };\n\n  testElevenLabs = async function () {\n    if (!elevenKey) {\n      setElevenStatus("أضف مفتاح ElevenLabs أولاً.", "error");\n      document.getElementById("eleven-inp")?.focus();\n      return;\n    }\n    stopAllAudio();\n    resetLBtns();\n    speakId = "eleven-test";\n    setElevenStatus("جاري اختبار ElevenLabs…", "info");\n    try {\n      await unlockElevenAudio();\n      await speakElevenLabs("مرحباً، صوت ElevenLabs يعمل الآن بنجاح.", "eleven-test");\n    } catch (error) {\n      speakId = null;\n      resetLBtns();\n      alert("تعذر تشغيل ElevenLabs:\\n" + friendlyElevenError(error));\n    }\n  };\n\n  speak = function (text, id) {\n    if (speakId === id) {\n      stopAllAudio();\n      speakId = null;\n      resetLBtns();\n      return;\n    }\n    stopAllAudio();\n    resetLBtns();\n    speakId = id;\n    const btn = document.getElementById("lb-" + id);\n    if (btn) {\n      btn.className = "lbtn listen-btn on";\n      btn.innerHTML = svgStop() + " إيقاف";\n    }\n    const clean = cleanTTS(text);\n    if (!clean) {\n      speakId = null;\n      resetLBtns();\n      return;\n    }\n    if (elevenKey) {\n      unlockElevenAudio()\n        .then(() => speakElevenLabs(clean, id))\n        .catch(error => {\n          speakId = null;\n          resetLBtns();\n          const message = friendlyElevenError(error);\n          setElevenStatus("خطأ: " + message, "error");\n          alert("تعذر تشغيل ElevenLabs:\\n" + message);\n        });\n      return;\n    }\n    if (!window.speechSynthesis) {\n      speakId = null;\n      resetLBtns();\n      return;\n    }\n    const words = clean.split(" ");\n    const chunks = [];\n    let buf = "";\n    for (const word of words) {\n      if ((buf + " " + word).trim().length > 140) {\n        if (buf) chunks.push(buf.trim());\n        buf = word;\n      } else {\n        buf = (buf + " " + word).trim();\n      }\n    }\n    if (buf) chunks.push(buf.trim());\n    setTimeout(() => speakWebSpeechChunks(chunks, id), 150);\n  };\n\n  const originalStartVoiceCall = startVoiceCall;\n  startVoiceCall = async function () {\n    if (elevenKey) {\n      try { await unlockElevenAudio(); } catch (e) {}\n    }\n    return originalStartVoiceCall();\n  };\n\n  speakVoiceCallReply = async function (text) {\n    if (!voiceCallActive) return;\n    voiceCallBusy = true;\n    voiceCallListening = false;\n    showCallRetry(false);\n    setCallState("speaking", "Nova يتحدث…", text);\n    const clean = cleanTTS(text);\n    if (clean) {\n      stopAllAudio();\n      speakId = "voice-call";\n      try {\n        if (elevenKey) {\n          await speakElevenLabs(clean, "voice-call");\n        } else {\n          const words = clean.split(" ");\n          const chunks = [];\n          let buf = "";\n          for (const word of words) {\n            if ((buf + " " + word).trim().length > 150) {\n              if (buf) chunks.push(buf.trim());\n              buf = word;\n            } else {\n              buf = (buf + " " + word).trim();\n            }\n          }\n          if (buf) chunks.push(buf.trim());\n          await speakWebSpeechChunks(chunks, "voice-call");\n        }\n      } catch (error) {\n        voiceCallBusy = false;\n        setCallState("", "تعذر تشغيل صوت ElevenLabs", friendlyElevenError(error));\n        showCallRetry(true);\n        return;\n      }\n    }\n    if (!voiceCallActive) return;\n    voiceCallBusy = false;\n    setCallState("", "دورك تتكلم…", "أنا بسمعك");\n    setTimeout(startVoiceCallListening, 350);\n  };\n\n  addElevenTestUI();\n  renderVoiceOpts();\n})();\n';
    html=html.replace('</body>','<scr'+'ipt>'+patch+'</scr'+'ipt></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.className='err';
    status.textContent='تعذر تشغيل NovaAI.\n\n'+(e?.message||e)+'\n\nحدّث الصفحة أو افتحها في Chrome.';
    console.error(e);
  }
})();
</script>
</body>
</html>
