<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{text-align:center;padding:24px}.logo{font-size:34px;font-weight:800}.msg{margin-top:14px;color:#9999b5}.err{max-width:620px;color:#ff8bad;line-height:1.8;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل الموقع…</div></div>
<script>window.__NOVA_B64="";</script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="../nova-ai-original-live/part-1.js?v=pako17"></script>
<script src="../nova-ai-original-live/part-2.js?v=pako17"></script>
<script src="../nova-ai-original-live/part-3.js?v=pako17"></script>
<script>
(function(){
  const status=document.getElementById('status');
  try{
    if(!window.pako) throw new Error('تعذر تحميل مكتبة فك الضغط. افتح الصفحة في Chrome وتأكد من اتصال الإنترنت.');
    if(!window.__NOVA_B64 || window.__NOVA_B64.length<1000) throw new Error('تعذر تحميل ملفات NOVA AI الأصلية.');

    const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const map=new Int16Array(128); map.fill(-1);
    for(let i=0;i<alphabet.length;i++) map[alphabet.charCodeAt(i)]=i;
    const clean=window.__NOVA_B64.replace(/[^A-Za-z0-9+/]/g,'');
    const out=new Uint8Array(Math.ceil(clean.length*3/4));
    let oi=0;
    for(let i=0;i<clean.length;i+=4){
      const a=map[clean.charCodeAt(i)] ?? -1;
      const b=i+1<clean.length ? map[clean.charCodeAt(i+1)] : 0;
      const c=i+2<clean.length ? map[clean.charCodeAt(i+2)] : 0;
      const d=i+3<clean.length ? map[clean.charCodeAt(i+3)] : 0;
      if(a<0||b<0||c<0||d<0) continue;
      const n=(a<<18)|(b<<12)|(c<<6)|d;
      out[oi++]=(n>>16)&255;
      if(i+2<clean.length) out[oi++]=(n>>8)&255;
      if(i+3<clean.length) out[oi++]=n&255;
    }
    const bytes=out.slice(0,oi);
    if(bytes.length<2 || bytes[0]!==31 || bytes[1]!==139) throw new Error('ملفات التطبيق غير مكتملة أو تالفة.');
    const raw=window.pako.ungzip(bytes);
    let html=new TextDecoder('utf-8').decode(raw);
    if(!html.includes('initApp')) throw new Error('ملف التطبيق النهائي غير مكتمل.');
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>NOVA AI</title>').replaceAll('NovaAI','NOVA AI');
    document.open(); document.write(html); document.close();
  }catch(e){
    status.className='err';
    status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+(e&&e.message?e.message:e);
  }
})();
</script>
</body>
</html>
