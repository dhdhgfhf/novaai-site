<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
html,body{height:100%;margin:0;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.logo{font-size:44px;font-weight:800}.msg{margin-top:18px;color:#9999b5;line-height:1.8}.err{max-width:700px;color:#ff8bad;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل النسخة الأصلية…</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const base='https://raw.githubusercontent.com/nova-ai-web-2026/novaai-site/main/nova-ai-original-clean/';
  const direct=['raw-1.js','raw-2.js','raw-3.js','raw-4.js','raw-5.js'];
  const encoded=['raw-6b.js','raw-7b.js','raw-8b.js'];

  function decode64(input){
    const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const map=new Int16Array(128); map.fill(-1);
    for(let i=0;i<alphabet.length;i++) map[alphabet.charCodeAt(i)]=i;
    const clean=String(input).replace(/[^A-Za-z0-9+/]/g,'');
    const out=new Uint8Array(Math.ceil(clean.length*3/4));
    let oi=0;
    for(let i=0;i<clean.length;i+=4){
      const a=map[clean.charCodeAt(i)];
      const b=i+1<clean.length?map[clean.charCodeAt(i+1)]:0;
      const c=i+2<clean.length?map[clean.charCodeAt(i+2)]:0;
      const d=i+3<clean.length?map[clean.charCodeAt(i+3)]:0;
      if(a<0||b<0||c<0||d<0) throw new Error('جزء Base64 غير صالح');
      const n=(a<<18)|(b<<12)|(c<<6)|d;
      out[oi++]=(n>>16)&255;
      if(i+2<clean.length) out[oi++]=(n>>8)&255;
      if(i+3<clean.length) out[oi++]=n&255;
    }
    return new TextDecoder('utf-8').decode(out.subarray(0,oi));
  }

  async function loadText(name){
    const response=await fetch(base+name+'?v=direct-raw-28',{cache:'no-store'});
    if(!response.ok) throw new Error(name+' لم يُحمّل: HTTP '+response.status);
    const text=await response.text();
    if(!text.trim()) throw new Error(name+' فارغ');
    return text;
  }

  try{
    window.__NOVA_HTML=[];
    window.__NOVA_JS64=[];

    const directCode=await Promise.all(direct.map(loadText));
    for(const code of directCode) new Function('window',code)(window);
    if(window.__NOVA_HTML.length!==5) throw new Error('الأجزاء المباشرة: '+window.__NOVA_HTML.length+'/5');

    const encodedCode=await Promise.all(encoded.map(loadText));
    for(const code of encodedCode) new Function('window',code)(window);
    if(window.__NOVA_JS64.length!==3) throw new Error('الأجزاء الأخيرة: '+window.__NOVA_JS64.length+'/3');

    for(const value of window.__NOVA_JS64){
      const decoded=decode64(value);
      new Function('window',decoded)(window);
    }
    if(window.__NOVA_HTML.length!==8) throw new Error('إجمالي الأجزاء: '+window.__NOVA_HTML.length+'/8');

    let html=window.__NOVA_HTML.join('');
    if(!html.includes('initApp()')) throw new Error('ملف التطبيق النهائي غير مكتمل');
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>NOVA AI</title>').replaceAll('NovaAI','NOVA AI');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    status.className='msg err';
    status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+(error&&error.message?error.message:String(error));
  }
})();
</script>
</body>
</html>
