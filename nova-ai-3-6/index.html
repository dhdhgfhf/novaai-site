<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{text-align:center;padding:24px}.logo{font-size:32px;font-weight:800;margin-bottom:10px}.msg{font-size:14px;color:#9999b5}.err{max-width:560px;line-height:1.8;color:#ff8bad;white-space:pre-wrap}
</style>
</head>
<body><div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري تشغيل الموقع…</div></div>
<script>
(async()=>{
 try{
  if(typeof DecompressionStream==='undefined') throw new Error('افتح الموقع في أحدث إصدار من Chrome أو Edge.');
  const names=['app-1.b64','app-2.b64','app-3.b64'];
  const parts=await Promise.all(names.map(async name=>{
    const r=await fetch(name+'?v=original36-20260730',{cache:'no-store'});
    if(!r.ok) throw new Error('تعذر تحميل '+name+' — HTTP '+r.status);
    return (await r.text()).trim();
  }));
  const binary=atob(parts.join(''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){const s=document.getElementById('status');s.className='err';s.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+(e?.message||e)}
})();
</script></body></html>
