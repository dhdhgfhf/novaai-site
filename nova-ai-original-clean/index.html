<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA AI</title><style>html,body{height:100%;margin:0;background:#0d0d12;color:#ededf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.logo{font-size:34px;font-weight:800}.msg{margin-top:14px;color:#9999b5}.err{max-width:620px;color:#ff8bad;line-height:1.8;white-space:pre-wrap}</style></head><body><div class="box"><div class="logo">NOVA AI</div><div class="msg" id="status">جاري فتح النسخة الأصلية…</div></div><script>window.__NOVA_HTML=[];window.__NOVA_JS64=[];(function(){const status=document.getElementById('status');const files=['raw-1.js','raw-2.js','raw-3.js','raw-4.js','raw-5a.js','raw-5b.js','raw-5c.js','raw-5d.js','raw-6b.js','raw-7b.js','raw-8b.js'];function addScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error(src));document.head.appendChild(s)})}function decode64(s){const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';const map=new Int16Array(128);map.fill(-1);for(let i=0;i<abc.length;i++)map[abc.charCodeAt(i)]=i;const clean=s.replace(/[^A-Za-z0-9+/]/g,'');const out=new Uint8Array(Math.ceil(clean.length*3/4));let oi=0;for(let i=0;i<clean.length;i+=4){const a=map[clean.charCodeAt(i)],b=i+1<clean.length?map[clean.charCodeAt(i+1)]:0,c=i+2<clean.length?map[clean.charCodeAt(i+2)]:0,d=i+3<clean.length?map[clean.charCodeAt(i+3)]:0;if(a<0||b<0||c<0||d<0)continue;const n=(a<<18)|(b<<12)|(c<<6)|d;out[oi++]=(n>>16)&255;if(i+2<clean.length)out[oi++]=(n>>8)&255;if(i+3<clean.length)out[oi++]=n&255}return new TextDecoder().decode(out.subarray(0,oi))}(async()=>{try{for(let i=0;i<files.length;i++){status.textContent='جاري تحميل NOVA AI… '+(i+1)+'/'+files.length;await addScript('./'+files[i]+'?v=fix26')}if(window.__NOVA_HTML.length!==8)throw new Error('الأجزاء الأولى لم تكتمل: '+window.__NOVA_HTML.length+'/8');if(window.__NOVA_JS64.length!==3)throw new Error('الأجزاء الأخيرة لم تكتمل: '+window.__NOVA_JS64.length+'/3');for(const encoded of window.__NOVA_JS64)new Function(decode64(encoded))();if(window.__NOVA_HTML.length!==11)throw new Error('ملفات التطبيق غير مكتملة بعد التجميع: '+window.__NOVA_HTML.length+'/11');const html=window.__NOVA_HTML.join('');if(!html.includes('initApp()'))throw new Error('ملف التطبيق النهائي غير مكتمل.');document.open();document.write(html);document.close()}catch(e){status.className='err';status.textContent='حدثت مشكلة أثناء تشغيل NOVA AI: '+(e&&e.message?e.message:e)}})()})();</script></body></html>
